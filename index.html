<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kuiz Huruf Vokal Serentak</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap');

        body {
            font-family: 'Andika', sans-serif;
            background-color: #fdf2f8; 
            touch-action: manipulation; /* Elak double-tap zoom */
            overflow: hidden; /* Halang scroll supaya muat satu skrin penuh */
        }

        /* Animasi visual (sangat penting untuk murid masalah pendengaran) */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px) rotate(-5deg); }
            75% { transform: translateX(10px) rotate(5deg); }
        }
        .animate-shake {
            animation: shake 0.5s ease-in-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop-in {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        /* Scrollbar tersorok jika perlu */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="h-[100dvh] w-screen bg-gradient-to-br from-yellow-100 via-pink-100 to-blue-100 flex items-center justify-center p-1 sm:p-4">

    <!-- Kad Utama: Dipaksa memenuhi ruang skrin supaya Split Screen selesa dimainkan -->
    <div class="bg-white/95 backdrop-blur-md rounded-[2rem] shadow-2xl w-full h-full max-w-[1400px] relative overflow-hidden flex flex-col border-4 sm:border-8 border-white" id="app-card">
        
        <!-- Bekas Dinamik -->
        <div id="screen-container" class="flex-grow w-full h-full flex flex-col items-center justify-center p-2 sm:p-4">
            <!-- Kandungan disuntik di sini -->
        </div>

    </div>

    <script>
        
        // Ciri keselamatan imej: Tukar ke bentuk kotak teks jika gambar asal (contoh: a.png) tiada
        window.handleImgError = function(imgElement, src) {
            const letter = src.replace('.png', '').toLowerCase();
            const div = document.createElement('div');
            
            // Ambil saiz dari class imej asal
            div.className = imgElement.className;
            div.classList.remove('object-contain');
            div.classList.add('flex', 'items-center', 'justify-center', 'font-bold', 'text-gray-400', 'bg-gray-100', 'border-4', 'border-dashed', 'border-gray-300', 'rounded-2xl');
            
            // Tentukan saiz font berdasarkan saiz responsif
            if (imgElement.className.includes('w-16')) {
                div.classList.add('text-3xl');
            } else if (imgElement.className.includes('w-24')) {
                div.classList.add('text-5xl');
            } else {
                div.classList.add('text-6xl', 'sm:text-[8rem]');
            }

            div.textContent = letter;
            
            if(imgElement.parentNode) {
                imgElement.parentNode.replaceChild(div, imgElement);
            }
        };

        // State Global Aplikasi
        let selectedPlayerCount = 0;
        let players = [];
        let globalQuestions = []; // Semua pemain akan menjawab set 10 soalan yang sama
        const vowels = ['a', 'e', 'i', 'o', 'u'];

        // Warna tema unik untuk membezakan zon setiap pemain di skrin
        const playerThemes = [
            { id: 0, title: 'Biru', bg: 'bg-blue-50', border: 'border-blue-400', text: 'text-blue-600', btnHov: 'hover:bg-blue-100', icon: 'text-blue-500' },
            { id: 1, title: 'Merah', bg: 'bg-rose-50', border: 'border-rose-400', text: 'text-rose-600', btnHov: 'hover:bg-rose-100', icon: 'text-rose-500' },
            { id: 2, title: 'Hijau', bg: 'bg-emerald-50', border: 'border-emerald-400', text: 'text-emerald-600', btnHov: 'hover:bg-emerald-100', icon: 'text-emerald-500' }
        ];

        const screenContainer = document.getElementById('screen-container');

        // Fungsi awal
        function init() {
            renderSetupScreen();
        }

        function renderSetupScreen() {
            selectedPlayerCount = 0;
            screenContainer.innerHTML = `
                <div class="text-center w-full max-w-4xl space-y-6 sm:space-y-10 animate-pop-in">
                    <div class="flex justify-center mb-4 sm:mb-6">
                        <div class="w-24 h-24 sm:w-40 sm:h-40 bg-white rounded-full shadow-2xl flex items-center justify-center text-[3rem] sm:text-[5rem] border-[6px] sm:border-[10px] border-yellow-300">
                            ✨
                        </div>
                    </div>
                    <h1 class="text-4xl sm:text-6xl md:text-7xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 drop-shadow-sm pb-2">
                        Kuiz Vokal Serentak
                    </h1>
                    <p class="text-xl sm:text-3xl font-bold text-gray-500">Pilih Jumlah Pemain</p>
                    
                    <div class="flex flex-wrap justify-center gap-4 sm:gap-10 mt-6 sm:mt-10">
                        <button onclick="selectPlayers(1)" id="btn-p1" class="player-btn w-24 h-24 sm:w-36 sm:h-36 rounded-[2rem] bg-gray-100 text-gray-400 text-3xl sm:text-5xl font-bold shadow-[0_8px_0_#d1d5db] transition-all border-4 border-transparent active:translate-y-2 active:shadow-none flex flex-col items-center justify-center gap-2">
                            <span>1</span><i class="fas fa-user text-xl sm:text-2xl"></i>
                        </button>
                        <button onclick="selectPlayers(2)" id="btn-p2" class="player-btn w-24 h-24 sm:w-36 sm:h-36 rounded-[2rem] bg-gray-100 text-gray-400 text-3xl sm:text-5xl font-bold shadow-[0_8px_0_#d1d5db] transition-all border-4 border-transparent active:translate-y-2 active:shadow-none flex flex-col items-center justify-center gap-2">
                            <span>2</span><div class="flex gap-1 text-lg sm:text-xl"><i class="fas fa-user"></i><i class="fas fa-user"></i></div>
                        </button>
                        <button onclick="selectPlayers(3)" id="btn-p3" class="player-btn w-24 h-24 sm:w-36 sm:h-36 rounded-[2rem] bg-gray-100 text-gray-400 text-3xl sm:text-5xl font-bold shadow-[0_8px_0_#d1d5db] transition-all border-4 border-transparent active:translate-y-2 active:shadow-none flex flex-col items-center justify-center gap-2">
                            <span>3</span><div class="flex gap-1 text-sm sm:text-lg"><i class="fas fa-user"></i><i class="fas fa-user"></i><i class="fas fa-user"></i></div>
                        </button>
                    </div>

                    <div class="h-20 sm:h-28 mt-6 sm:mt-10 flex items-center justify-center">
                        <button id="start-btn" onclick="startGame()" class="hidden px-10 py-4 sm:px-14 sm:py-6 bg-gradient-to-b from-green-400 to-green-600 text-white text-2xl sm:text-4xl font-bold rounded-full shadow-[0_8px_0_#166534] transition-all active:shadow-none active:translate-y-2">
                            Mula Main! <i class="fas fa-rocket ml-2 sm:ml-3"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        window.selectPlayers = function(num) {
            selectedPlayerCount = num;
            document.querySelectorAll('.player-btn').forEach(btn => {
                btn.className = "player-btn w-24 h-24 sm:w-36 sm:h-36 rounded-[2rem] bg-gray-100 text-gray-400 text-3xl sm:text-5xl font-bold shadow-[0_8px_0_#d1d5db] transition-all border-4 border-transparent active:translate-y-2 active:shadow-none flex flex-col items-center justify-center gap-2";
            });

            const selectedBtn = document.getElementById(`btn-p${num}`);
            selectedBtn.className = "player-btn w-24 h-24 sm:w-36 sm:h-36 rounded-[2rem] bg-indigo-100 text-indigo-600 text-3xl sm:text-5xl font-bold shadow-[0_8px_0_#4f46e5] transition-all border-4 border-indigo-400 active:translate-y-2 active:shadow-none flex flex-col items-center justify-center gap-2 scale-110";

            const startBtn = document.getElementById('start-btn');
            startBtn.classList.remove('hidden');
            startBtn.classList.add('animate-pop-in');
        };

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        window.startGame = function() {
            // Sediakan profil pemain berdasarkan jumlah
            players = [];
            for(let i=0; i<selectedPlayerCount; i++) {
                players.push({
                    id: i,
                    theme: playerThemes[i],
                    score: 0,
                    currentIndex: 0,      // Setiap pemain mempunyai Index Soalan berasingan
                    isFinished: false     // Status tamat untuk pemain ini sahaja
                });
            }

            // Jana 10 Soalan Rawak (1 Set global, tetapi setiap pemain jawab pada kelajuan sendiri)
            globalQuestions = [];
            vowels.forEach(v => {
                // 5 Soalan: Gambar ke Huruf
                globalQuestions.push({
                    type: 'image_to_letter',
                    item: `${v}.png`,
                    answer: v,
                    options: [...vowels]
                });
                // 5 Soalan: Huruf ke Gambar
                globalQuestions.push({
                    type: 'letter_to_image',
                    item: v,
                    answer: `${v}.png`,
                    options: vowels.map(vo => `${vo}.png`)
                });
            });

            // Rawakkan susunan soalan dan pilihan jawapan
            globalQuestions.forEach(q => shuffleArray(q.options));
            shuffleArray(globalQuestions);

            renderGameGrid();
        };

        function renderGameGrid() {
            // Tentukan susun atur (Layout) berdasaran saiz skrin dan jumlah pemain
            // Mobile (Portrait): Susun menegak (Rows)
            // Desktop (Landscape): Susun mendatar (Cols)
            let layoutClasses = "";
            if (selectedPlayerCount === 1) {
                layoutClasses = "grid-cols-1 grid-rows-1";
            } else if (selectedPlayerCount === 2) {
                layoutClasses = "grid-cols-1 grid-rows-2 md:grid-cols-2 md:grid-rows-1";
            } else if (selectedPlayerCount === 3) {
                layoutClasses = "grid-cols-1 grid-rows-3 md:grid-cols-3 md:grid-rows-1";
            }

            // Bina grid utama (Memenuhi 100% tinggi dan lebar bekas)
            let html = `<div class="grid w-full h-full gap-2 sm:gap-4 ${layoutClasses}">`;
            
            // Sediakan bekas "Zon Pemain" kosong dahulu
            players.forEach(p => {
                html += `
                    <div id="zone-${p.id}" class="relative w-full h-full ${p.theme.bg} rounded-[1.5rem] border-4 ${p.theme.border} shadow-inner flex flex-col p-2 sm:p-4 overflow-hidden animate-pop-in">
                        <!-- Kandungan Pemain Akan Disuntik Di Sini Secara Dinamik -->
                    </div>
                `;
            });
            html += `</div>`;
            screenContainer.innerHTML = html;

            // Render soalan pertama ke dalam setiap zon
            players.forEach(p => renderPlayerZone(p.id));
        }

        function renderPlayerZone(playerId) {
            const player = players[playerId];
            const zone = document.getElementById(`zone-${playerId}`);
            
            // Jika pemain ini sudah habis 10 soalan
            if (player.isFinished) {
                zone.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-center p-4 animate-pop-in">
                        <div class="text-5xl sm:text-7xl mb-4 animate-bounce">🎉</div>
                        <h2 class="text-3xl sm:text-4xl font-bold ${player.theme.text} mb-2">Siap!</h2>
                        <div class="bg-white px-6 py-3 rounded-full shadow-md border-2 ${player.theme.border} mb-4">
                            <span class="text-2xl font-bold text-gray-600">Markah: </span>
                            <span class="text-3xl font-bold ${player.theme.text}">${player.score} ⭐</span>
                        </div>
                        <p class="text-lg sm:text-xl font-bold text-gray-400 bg-gray-100 px-4 py-2 rounded-xl">Menunggu rakan...</p>
                    </div>
                `;
                return;
            }

            const q = globalQuestions[player.currentIndex];
            const t = player.theme;

            // Bahagian Atas: Status
            const headerHtml = `
                <div class="flex justify-between items-center bg-white/80 px-3 py-2 sm:px-4 sm:py-3 rounded-2xl shadow-sm border-2 ${t.border} mb-2 sm:mb-4">
                    <span class="font-bold text-sm sm:text-lg ${t.text} flex items-center gap-2"><i class="fas fa-user"></i> P${playerId + 1}</span>
                    <span class="font-bold text-xs sm:text-md bg-gray-100 text-gray-500 px-2 py-1 rounded-md">Soalan ${player.currentIndex + 1}/10</span>
                    <span class="font-bold text-sm sm:text-xl ${t.text}">${player.score} ⭐</span>
                </div>
            `;

            // Bahagian Tengah: Soalan
            let questionHtml = '';
            // Mengubah suai saiz elemen soalan supaya muat dalam ruang yang terhad
            let qSizeClass = selectedPlayerCount >= 3 ? 'w-16 h-16 sm:w-32 sm:h-32' : 'w-20 h-20 sm:w-48 sm:h-48';
            let textSizeClass = selectedPlayerCount >= 3 ? 'text-6xl sm:text-8xl' : 'text-[5rem] sm:text-[10rem]';

            if (q.type === 'image_to_letter') {
                questionHtml = `<img src="${q.item}" class="${qSizeClass} object-contain drop-shadow-xl bg-white p-2 rounded-xl sm:rounded-[2rem] border-2 sm:border-4 border-gray-100 mx-auto" onerror="handleImgError(this, '${q.item}')" />`;
            } else {
                questionHtml = `<div class="${textSizeClass} font-bold ${t.text} leading-none drop-shadow-lg bg-white px-6 py-2 sm:px-12 sm:py-6 rounded-xl sm:rounded-[2rem] border-2 sm:border-4 ${t.border}">${q.item}</div>`;
            }

            // Bahagian Bawah: Pilihan Jawapan (Butang multichoice)
            let optSizeClass = selectedPlayerCount >= 3 ? 'w-12 h-12 sm:w-20 sm:h-20 text-3xl sm:text-4xl' : 'w-14 h-14 sm:w-24 sm:h-24 text-3xl sm:text-[4rem]';
            let optionsHtml = q.options.map(opt => {
                if (q.type === 'image_to_letter') {
                    // Teks (Huruf)
                    return `<button onclick="handleAnswer(${playerId}, '${opt}')" class="${optSizeClass} bg-white rounded-xl sm:rounded-2xl border-b-4 border-gray-300 font-bold text-gray-600 shadow-md ${t.btnHov} transition-transform active:translate-y-1 active:border-b-0 flex items-center justify-center hover:-translate-y-1">${opt}</button>`;
                } else {
                    // Imej
                    return `<button onclick="handleAnswer(${playerId}, '${opt}')" class="${optSizeClass} bg-white rounded-xl sm:rounded-2xl border-b-4 border-gray-300 shadow-md ${t.btnHov} transition-transform active:translate-y-1 active:border-b-0 flex items-center justify-center p-1 sm:p-2 hover:-translate-y-1"><img src="${opt}" class="w-full h-full object-contain" onerror="handleImgError(this, '${opt}')" /></button>`;
                }
            }).join('');

            // Membina HTML Akhir untuk zon ini (termasuk Overlay Maklum Balas tersembunyi)
            zone.innerHTML = `
                <div class="flex flex-col h-full relative w-full">
                    ${headerHtml}
                    
                    <div class="flex-grow flex items-center justify-center my-1 sm:my-2">
                        ${questionHtml}
                    </div>

                    <div class="flex flex-wrap justify-center gap-1 sm:gap-3 mt-auto mb-1 sm:mb-2">
                        ${optionsHtml}
                    </div>

                    <!-- Overlay Maklum Balas Setempat (Hanya muncul atas zon pemain ini) -->
                    <div id="feedback-${playerId}" class="absolute inset-0 bg-white/95 backdrop-blur-sm rounded-xl hidden flex-col items-center justify-center z-10 transition-opacity duration-200 opacity-0">
                        <!-- Disuntik semasa jawapan disemak -->
                    </div>
                </div>
            `;
        }

        window.handleAnswer = function(playerId, selectedOpt) {
            const player = players[playerId];
            const q = globalQuestions[player.currentIndex];
            const zone = document.getElementById(`zone-${playerId}`);
            const feedbackOverlay = zone.querySelector(`#feedback-${playerId}`);
            
            const isCorrect = (selectedOpt === q.answer);

            if (isCorrect) {
                player.score += 1;
            }

            // Tunjukkan maklum balas dengan paparan visual besar dan sangat jelas (Mesra masalah pendengaran)
            feedbackOverlay.classList.remove('hidden');
            // Sedikit delay untuk kesan CSS transition
            setTimeout(() => { feedbackOverlay.classList.remove('opacity-0'); }, 10);

            if (isCorrect) {
                feedbackOverlay.innerHTML = `
                    <div class="text-[5rem] sm:text-[8rem] animate-bounce mb-2">🌟</div>
                    <div class="text-3xl sm:text-5xl font-bold text-green-500 bg-green-50 px-6 py-2 rounded-full border-4 border-green-200">BETUL!</div>
                `;
            } else {
                // Sediakan paparan "Jawapan Betul" secara visual
                let correctVisual = '';
                if (q.answer.endsWith('.png')) {
                    correctVisual = `<img src="${q.answer}" class="w-16 h-16 sm:w-24 sm:h-24 object-contain" onerror="handleImgError(this, '${q.answer}')" />`;
                } else {
                    correctVisual = `<div class="text-5xl sm:text-7xl font-bold text-green-600">${q.answer}</div>`;
                }

                feedbackOverlay.innerHTML = `
                    <div class="text-[4rem] sm:text-[6rem] animate-shake mb-1 sm:mb-4">❌</div>
                    <div class="text-xl sm:text-3xl font-bold text-red-500 mb-1 sm:mb-2 bg-red-50 px-4 py-1 rounded-full border-2 border-red-200">CUBA LAGI</div>
                    <div class="text-xs sm:text-sm font-bold text-gray-500 mt-2 uppercase tracking-wide">Jawapan Betul:</div>
                    <div class="bg-white p-2 sm:p-4 rounded-xl sm:rounded-2xl shadow-lg border-4 border-green-400 mt-1">${correctVisual}</div>
                `;
            }

            // Tunggu sebentar supaya murid nampak jawapan, kemudian ke soalan seterusnya
            // Masa menunggu pantas jika betul, lebih lama jika salah supaya sempat lihat pembetulan
            const delay = isCorrect ? 1500 : 3500;
            
            setTimeout(() => {
                feedbackOverlay.classList.add('opacity-0');
                
                setTimeout(() => {
                    player.currentIndex++;
                    if (player.currentIndex >= globalQuestions.length) {
                        player.isFinished = true;
                    }
                    
                    // Render semula hanya zon pemain yang berkenaan
                    renderPlayerZone(playerId);
                    
                    // Semak jika semua pemain telah tamat bermain
                    checkGlobalGameCompletion();

                }, 200); // Masa untuk fade out
            }, delay);
        };

        function checkGlobalGameCompletion() {
            // Jika setiap pemain berstatus isFinished = true
            const allDone = players.every(p => p.isFinished);
            
            if (allDone) {
                setTimeout(() => {
                    renderGlobalResults();
                }, 1000); // Tunggu sikit sebelum tukar skrin sepenuhnya
            }
        }

        function createConfetti() {
            const emojis = ['🎉', '🎈', '✨', '🏆'];
            for(let i=0; i<30; i++) {
                const el = document.createElement('div');
                el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                el.style.position = 'fixed';
                el.style.left = Math.random() * 100 + 'vw';
                el.style.top = '-100px';
                el.style.fontSize = (Math.random() * 20 + 20) + 'px';
                el.style.zIndex = '9999';
                el.style.pointerEvents = 'none';
                el.style.transition = 'transform 3s ease-out, top 3s ease-in, opacity 3s';
                document.body.appendChild(el);

                setTimeout(() => {
                    el.style.top = '100vh';
                    el.style.transform = `rotate(${Math.random() * 720}deg) translateX(${Math.random() * 200 - 100}px)`;
                    el.style.opacity = '0';
                }, 50);

                setTimeout(() => el.remove(), 3000);
            }
        }

        function renderGlobalResults() {
            // Urutkan markah dari tinggi ke rendah
            const sortedPlayers = [...players].sort((a, b) => b.score - a.score);
            const highestScore = sortedPlayers[0].score;
            const winners = sortedPlayers.filter(p => p.score === highestScore);

            let winnerText = '';
            if (players.length === 1) {
                winnerText = `Hebat! Anda mengutip ${highestScore} bintang!`;
            } else if (winners.length > 1) {
                winnerText = "Wah, Keputusan Seri! 🤝";
            } else {
                winnerText = `Pemain ${winners[0].id + 1} (${winners[0].theme.title}) Juara! 🏆`;
            }

            let playerRowsHtml = sortedPlayers.map((p, index) => {
                let isWinner = p.score === highestScore;
                let rankTrophy = index === 0 && !winners.length > 1 ? '<i class="fas fa-crown text-yellow-400 absolute -top-4 -left-4 text-4xl transform -rotate-12"></i>' : '';
                
                return `
                <div class="relative flex items-center justify-between bg-white p-4 sm:p-6 rounded-[2rem] shadow-sm border-4 ${p.theme.border} transform transition-transform hover:scale-105 mb-4">
                    ${rankTrophy}
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 sm:w-16 sm:h-16 rounded-full ${p.theme.bg} ${p.theme.text} flex items-center justify-center font-bold text-2xl sm:text-3xl border-2 ${p.theme.border}">
                            P${p.id + 1}
                        </div>
                        <span class="text-xl sm:text-3xl font-bold text-gray-700 hidden sm:block">Pemain ${p.id + 1}</span>
                    </div>
                    <div class="flex items-center gap-2 sm:gap-4 bg-gray-50 px-4 py-2 sm:px-6 sm:py-3 rounded-[1.5rem] border-2 border-gray-100">
                        <span class="text-3xl sm:text-5xl font-bold ${p.theme.text}">${p.score}</span>
                        <i class="fas fa-star text-yellow-400 text-2xl sm:text-4xl drop-shadow-sm"></i>
                    </div>
                </div>
            `}).join('');

            screenContainer.innerHTML = `
                <div class="text-center w-full max-w-2xl mx-auto flex flex-col justify-center items-center h-full animate-pop-in">
                    <div class="text-[5rem] sm:text-[8rem] mb-2 sm:mb-6 animate-bounce">🎊</div>
                    <h1 class="text-4xl sm:text-7xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-red-500 drop-shadow-sm pb-2">
                        Tamat!
                    </h1>
                    
                    <h2 class="text-xl sm:text-3xl font-bold text-indigo-600 bg-indigo-50 px-6 py-3 sm:px-10 sm:py-4 rounded-full border-4 border-indigo-200 mt-2 mb-6 sm:mb-8 text-center leading-tight">
                        ${winnerText}
                    </h2>

                    <div class="w-full bg-white/60 p-4 sm:p-8 rounded-[2.5rem] border-4 border-dashed border-gray-300 backdrop-blur-sm">
                        ${playerRowsHtml}
                    </div>

                    <div class="mt-8 sm:mt-10">
                        <button onclick="init()" class="px-8 py-4 sm:px-12 sm:py-5 bg-gradient-to-b from-blue-400 to-blue-600 text-white text-2xl sm:text-4xl font-bold rounded-full shadow-[0_8px_0_#1e3a8a] active:shadow-none active:translate-y-2 transition-all flex items-center gap-3">
                            Main Semula <i class="fas fa-redo"></i>
                        </button>
                    </div>
                </div>
            `;
            
            // Perayaan meriah
            createConfetti();
            setTimeout(createConfetti, 800);
            setTimeout(createConfetti, 1600);
        }

        // Mulakan aplikasi
        window.onload = init;

    </script>
</body>
</html>
